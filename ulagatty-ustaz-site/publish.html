<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мақала жариялау — Ұлағатты Ұстаз</title>
<meta name="description" content="Мақалаңызды жариялаңыз және сертификат алыңыз.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>📘</text></svg>">
</head>
<body data-page="publish">
<div id="site-header"></div>

<section class="page-hero">
  <svg class="page-hero__orn" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#2aa564" stroke-width="2" opacity=".4"><path d="M1050 70 q60 -60 120 0 q60 60 120 0 q60 -60 120 0"/></g><g fill="#d4af37" opacity=".3"><circle cx="120" cy="80" r="5"/><circle cx="1340" cy="200" r="5"/></g></svg>
  <div class="container">
    <div class="breadcrumbs"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="pub.title"></span></div>
    <h1 data-i18n="pub.title"></h1>
    <p data-i18n="pub.lead"></p>
  </div>
</section>

<!-- how it works -->
<section class="section section--tight">
  <div class="container">
    <div class="features" style="grid-template-columns:repeat(3,1fr)">
      <div class="feature reveal"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></span><h3 data-i18n="pub.s1t"></h3><p data-i18n="pub.s1d"></p></div>
      <div class="feature reveal"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg></span><h3 data-i18n="pub.s2t"></h3><p data-i18n="pub.s2d"></p></div>
      <div class="feature reveal"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15l-3 6 3-1.5L15 21l-3-6"/><circle cx="12" cy="9" r="7"/></svg></span><h3 data-i18n="pub.s3t"></h3><p data-i18n="pub.s3d"></p></div>
    </div>
  </div>
</section>

<!-- form -->
<section class="section section--tight" style="background:var(--cream)">
  <div class="container" style="max-width:760px">
    <form data-demo class="contact-card reveal" style="padding:32px">
      <h3 class="title" style="margin-bottom:18px" data-i18n="pub.step1"></h3>
      <div class="field"><label data-i18n="pub.arttitle"></label><input type="text" required></div>
      <div class="form-row">
        <div class="field"><label data-i18n="pub.category"></label>
          <select>
            <option data-i18n="sec.ustaz"></option>
            <option data-i18n="sec.school"></option>
            <option data-i18n="sec.tarbie"></option>
            <option data-i18n="sec.method"></option>
          </select>
        </div>
        <div class="field"><label data-i18n="pub.author"></label><input type="text" required></div>
      </div>
      <div class="field"><label data-i18n="pub.work"></label><input type="text"></div>
      <div class="field"><label data-i18n="pub.text"></label><textarea style="min-height:160px" required></textarea></div>
      <div class="field">
        <label data-i18n="pub.photo"></label>
        <label class="dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          <b data-i18n="pub.photo"></b><span data-i18n="pay.drophint"></span>
          <input type="file" accept="image/*" hidden>
        </label>
      </div>

      <h3 class="title" style="margin:24px 0 16px" data-i18n="pub.step2"></h3>
      <div class="form-row">
        <div class="field"><label data-i18n="pay.phone"></label><input type="tel" placeholder="+7 ___ ___ __ __" required></div>
        <div class="field"><label data-i18n="pay.plan"></label><input type="text" value="2 500 ₸" readonly></div>
      </div>
      <div class="field">
        <label data-i18n="pay.title"></label>
        <label class="dropzone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
          <b data-i18n="pay.drop"></b><span data-i18n="pay.drophint"></span>
          <input type="file" accept="image/*,.pdf" hidden>
        </label>
      </div>
      <button type="submit" class="btn btn--primary btn--block btn--lg" data-i18n="pub.submit"></button>
      <p class="form-alt"><span data-i18n="pay.note"></span> &nbsp;
        <a href="#" style="display:inline-flex;gap:5px;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3L2.9 11.7c-1.3.5-1.3 1.3-.2 1.6l4.8 1.5 1.9 5.8c.2.6.4.8.9.8.3 0 .5-.1.7-.3l2.6-2.5 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.1-1.1z"/></svg>Telegram</a> ·
        <a href="#">WhatsApp</a></p>
    </form>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
