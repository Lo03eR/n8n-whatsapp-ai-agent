<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жазылым және төлем — Ұлағатты Ұстаз</title>
<meta name="description" content="Тарифтер, жазылым және төлем чегін растау.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🎓</text></svg>">
</head>
<body data-page="subscription">
<div id="site-header"></div>

<section class="page-hero">
  <svg class="page-hero__orn" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#2aa564" stroke-width="2" opacity=".4"><path d="M1050 70 q60 -60 120 0 q60 60 120 0 q60 -60 120 0"/></g><g fill="#d4af37" opacity=".3"><circle cx="120" cy="80" r="5"/><circle cx="1340" cy="200" r="5"/></g></svg>
  <div class="container">
    <div class="breadcrumbs"><a href="index.html" data-i18n="nav.home"></a> / <span data-i18n="nav.subscription"></span></div>
    <h1 data-i18n="spage.title"></h1>
    <p data-i18n="spage.lead"></p>
  </div>
</section>

<!-- Pricing -->
<section class="section">
  <div class="container">
    <div class="pricing">
      <div class="plan reveal">
        <h3 data-i18n="p1.name"></h3>
        <div class="pamount">2 500 ₸ <small data-i18n="plan.once"></small></div>
        <p class="pdesc" data-i18n="p1.desc"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p1.f1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p1.f2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p1.f3"></span></li>
        </ul>
        <a href="#pay" class="btn btn--ghost btn--block" data-i18n="plan.choose" data-plan="p1.name"></a>
      </div>

      <div class="plan featured reveal">
        <span class="ribbon" data-i18n="plan.pop"></span>
        <h3 data-i18n="p2.name"></h3>
        <div class="pamount">19 900 ₸ <small data-i18n="plan.year"></small></div>
        <p class="pdesc" data-i18n="p2.desc"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p2.f1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p2.f2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p2.f3"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p2.f4"></span></li>
        </ul>
        <a href="#pay" class="btn btn--primary btn--block" data-i18n="plan.choose" data-plan="p2.name"></a>
      </div>

      <div class="plan reveal">
        <h3 data-i18n="p3.name"></h3>
        <div class="pamount">99 000 ₸ <small data-i18n="plan.year"></small></div>
        <p class="pdesc" data-i18n="p3.desc"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p3.f1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p3.f2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p3.f3"></span></li>
        </ul>
        <a href="#pay" class="btn btn--ghost btn--block" data-i18n="plan.choose" data-plan="p3.name"></a>
      </div>
    </div>
  </div>
</section>

<!-- Payment / check upload (mirrors the Telegram/WhatsApp bot flow) -->
<section class="section" style="background:var(--cream)" id="pay">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-aside">
        <svg class="auth-aside__orn" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2"><path d="M-20 120 q40 -40 80 0 q40 40 80 0 q40 -40 80 0 q40 40 80 0 q40 -40 80 0"/><path d="M-20 480 q40 -40 80 0 q40 40 80 0 q40 -40 80 0 q40 40 80 0 q40 -40 80 0"/></g></svg>
        <h2 data-i18n="pay.title"></h2>
        <p data-i18n="pay.lead"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="p1.f2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="pay.note"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="faq.a2"></span></li>
        </ul>
      </div>
      <div class="auth-main">
        <form data-demo>
          <div class="form-row">
            <div class="field"><label data-i18n="pay.name"></label><input type="text" required></div>
            <div class="field"><label data-i18n="pay.phone"></label><input type="tel" placeholder="+7 ___ ___ __ __" required></div>
          </div>
          <div class="field">
            <label data-i18n="pay.plan"></label>
            <select id="planSelect">
              <option data-i18n="p1.name"></option>
              <option data-i18n="p2.name" selected></option>
              <option data-i18n="p3.name"></option>
            </select>
          </div>
          <div class="field">
            <label data-i18n="pay.title"></label>
            <label class="dropzone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
              <b data-i18n="pay.drop"></b>
              <span data-i18n="pay.drophint"></span>
              <input type="file" accept="image/*,.pdf" hidden>
            </label>
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg" data-i18n="pay.submit"></button>
          <p class="form-alt"><a href="#" style="display:inline-flex;gap:6px;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3L2.9 11.7c-1.3.5-1.3 1.3-.2 1.6l4.8 1.5 1.9 5.8c.2.6.4.8.9.8.3 0 .5-.1.7-.3l2.6-2.5 4.8 3.6c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.9-1.1-1.1z"/></svg> Telegram</a> · <a href="#">WhatsApp</a></p>
        </form>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
