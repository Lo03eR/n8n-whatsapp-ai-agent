<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кіру — Ұлағатты Ұстаз</title>
<meta name="description" content="Жеке кабинетке кіру немесе тіркелу.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>🎓</text></svg>">
</head>
<body data-page="login">
<div id="site-header"></div>

<section class="section">
  <div class="container" style="max-width:940px">
    <div class="auth-wrap reveal in">
      <div class="auth-aside">
        <svg class="auth-aside__orn" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2"><path d="M-20 120 q40 -40 80 0 q40 40 80 0 q40 -40 80 0 q40 40 80 0 q40 -40 80 0"/><path d="M-20 300 q40 -40 80 0 q40 40 80 0 q40 -40 80 0 q40 40 80 0 q40 -40 80 0"/><path d="M-20 480 q40 -40 80 0 q40 40 80 0 q40 -40 80 0 q40 40 80 0 q40 -40 80 0"/></g></svg>
        <h2 data-i18n="login.title"></h2>
        <p data-i18n="login.sub"></p>
        <ul>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="login.b1"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="login.b2"></span></li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg><span data-i18n="login.b3"></span></li>
        </ul>
      </div>
      <div class="auth-main">
        <div class="tabs" data-tabs>
          <button data-tab="login" class="active" data-i18n="login.tablogin"></button>
          <button data-tab="register" data-i18n="login.tabreg"></button>
        </div>

        <!-- Login pane -->
        <form data-pane="login" data-demo>
          <div class="field"><label data-i18n="login.email"></label><input type="email" placeholder="you@mail.kz" required></div>
          <div class="field"><label data-i18n="login.password"></label><input type="password" placeholder="••••••••" required></div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <label class="checkbox"><input type="checkbox"><span data-i18n="login.remember"></span></label>
            <a href="#" class="form-alt" style="margin:0"><span data-i18n="login.forgot"></span></a>
          </div>
          <button type="submit" class="btn btn--primary btn--block btn--lg form-foot" data-i18n="login.submit"></button>
        </form>

        <!-- Register pane -->
        <form data-pane="register" data-demo style="display:none">
          <div class="field"><label data-i18n="login.name"></label><input type="text" required></div>
          <div class="form-row">
            <div class="field"><label data-i18n="login.email"></label><input type="email" required></div>
            <div class="field"><label data-i18n="login.phone"></label><input type="tel" placeholder="+7 ___ ___ __ __"></div>
          </div>
          <div class="field"><label data-i18n="login.password"></label><input type="password" required></div>
          <label class="checkbox" style="margin-bottom:6px"><input type="checkbox" required><span data-i18n="login.agree"></span></label>
          <button type="submit" class="btn btn--primary btn--block btn--lg form-foot" data-i18n="login.submitreg"></button>
        </form>
      </div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
