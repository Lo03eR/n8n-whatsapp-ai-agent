# ============================================================
#  Основной сайт: ulagattyustaz.kz  (статика из /var/www/html)
#  Жёсткий редирект HTTP -> HTTPS (301), чтобы Google индексировал
#  только https-версию. www -> без www.
#
#  Куда положить:
#     sudo cp nginx-site.conf /etc/nginx/sites-available/ulagattyustaz.kz
#     sudo ln -s /etc/nginx/sites-available/ulagattyustaz.kz /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS-сертификат (если ещё не выпущен) добавит строки ssl_* сам:
#     sudo certbot --nginx -d ulagattyustaz.kz -d www.ulagattyustaz.kz
# ============================================================

# 1) HTTP :80 — всегда редирект на https (и www -> без www)
server {
    listen 80;
    listen [::]:80;
    server_name ulagattyustaz.kz www.ulagattyustaz.kz;
    return 301 https://ulagattyustaz.kz$request_uri;
}

# 2) HTTPS www -> без www (канонический адрес один)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ulagattyustaz.kz;

    # пути к сертификату подставит certbot (оставь как у тебя уже выпущено)
    ssl_certificate     /etc/letsencrypt/live/ulagattyustaz.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulagattyustaz.kz/privkey.pem;

    return 301 https://ulagattyustaz.kz$request_uri;
}

# 3) HTTPS основной сайт
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ulagattyustaz.kz;

    root /var/www/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ulagattyustaz.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ulagattyustaz.kz/privkey.pem;

    # «чистые» адреса статей: /article/<slug>/  -> index.html внутри папки
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # лёгкое кеширование статики
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
