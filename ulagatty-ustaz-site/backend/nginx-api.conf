# ============================================================
#  Reverse proxy: api.ulagattyustaz.kz  ->  Directus (127.0.0.1:8055)
#
#  Куда положить:
#     sudo cp nginx-api.conf /etc/nginx/sites-available/api.ulagattyustaz.kz
#     sudo ln -s /etc/nginx/sites-available/api.ulagattyustaz.kz /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
#  Потом включить HTTPS (сертификат добавит/перепишет этот файл сам):
#     sudo certbot --nginx -d api.ulagattyustaz.kz
# ============================================================
server {
    listen 80;
    server_name api.ulagattyustaz.kz;

    client_max_body_size 25m;   # под загрузку чеков/фото

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
